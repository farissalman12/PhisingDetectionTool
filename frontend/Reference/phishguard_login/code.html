<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PhishGuard Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5247e6",
                        "primary-hover": "#4238ca",
                        "background-light": "#f8fafc","background-dark": "#0f172a","card-light": "#ffffff",
                        "card-dark": "#1e293b",
                        "input-border": "#e2e8f0","input-border-dark": "#334155",},
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem","lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'xs': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
                    }
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-50 antialiased min-h-screen flex flex-col">
<header class="w-full py-4 px-6 sm:px-10 flex justify-between items-center fixed top-0 left-0 z-10">
<div class="flex items-center gap-2 group cursor-pointer">
<div class="text-primary">
<span class="material-symbols-outlined text-3xl">verified_user</span>
</div>
<div class="flex items-baseline gap-2">
<h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">PhishGuard</h1>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400 tracking-wide">by Faris Salman</span>
</div>
</div>
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors duration-200 dark:text-slate-400" href="#">Help Center</a>
</header>
<main class="flex-grow flex items-center justify-center p-4 sm:p-6 w-full h-screen">
<div class="w-full max-w-[420px] bg-card-light dark:bg-card-dark rounded-xl border border-input-border dark:border-input-border-dark shadow-xs sm:shadow-lg transition-all duration-200">
<div class="p-8 sm:p-10 flex flex-col gap-6">
<div class="flex flex-col gap-2 text-center">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white tracking-tight">Welcome back</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">
                        Enter your credentials to access your security dashboard.
                    </p>
</div>
<form action="#" class="flex flex-col gap-4" method="POST">
<div class="space-y-2">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-200 peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="email">Email</label>
<div class="relative">
<input class="flex h-10 w-full rounded-md border border-input-border bg-background-light px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:border-input-border-dark dark:bg-slate-950 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:text-white transition-all duration-200" id="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-sm font-medium leading-none text-slate-700 dark:text-slate-200 peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="password">Password</label>
<a class="text-sm font-medium text-primary hover:text-primary-hover hover:underline transition-colors" href="#" tabindex="-1">
                                Forgot password?
                            </a>
</div>
<div class="relative">
<input class="flex h-10 w-full rounded-md border border-input-border bg-background-light px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 dark:border-input-border-dark dark:bg-slate-950 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:text-white transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-white hover:bg-primary-hover h-10 px-4 py-2 w-full mt-2 shadow-sm" type="submit">
                        Sign In
                    </button>
</form>
<div class="relative">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-slate-200 dark:border-slate-700"></span>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-card-light dark:bg-card-dark px-2 text-slate-400">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input-border bg-white hover:bg-slate-50 hover:text-slate-900 h-10 px-4 py-2 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:hover:bg-slate-700">
<svg aria-hidden="true" class="mr-2 h-4 w-4" data-icon="github" data-prefix="fab" fill="currentColor" focusable="false" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path>
</svg>
                        GitHub
                    </button>
<button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 border border-input-border bg-white hover:bg-slate-50 hover:text-slate-900 h-10 px-4 py-2 dark:border-slate-700 dark:bg-slate-800 dark:text-white dark:hover:bg-slate-700">
<svg aria-hidden="true" class="mr-2 h-4 w-4" data-icon="google" data-prefix="fab" fill="currentColor" focusable="false" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path>
</svg>
                        Google
                    </button>
</div>
<div class="text-center text-sm text-slate-500 dark:text-slate-400 mt-2">
                    Don't have an account? 
                    <a class="font-medium text-primary hover:text-primary-hover hover:underline underline-offset-4 transition-all" href="#">
                        Sign up
                    </a>
</div>
</div>
</div>
<div class="fixed inset-0 -z-10 pointer-events-none opacity-50 dark:opacity-20 overflow-hidden">
<div class="absolute -top-[10%] -right-[5%] w-[40rem] h-[40rem] rounded-full bg-primary/5 blur-[100px]"></div>
<div class="absolute -bottom-[10%] -left-[5%] w-[35rem] h-[35rem] rounded-full bg-indigo-400/10 blur-[90px]"></div>
</div>
</main>
<footer class="w-full py-6 text-center text-xs text-slate-400 dark:text-slate-600">
<p>© 2024 PhishGuard Security Inc. All rights reserved.</p>
<div class="mt-2 space-x-4">
<a class="hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Privacy</a>
<a class="hover:text-slate-600 dark:hover:text-slate-400 transition-colors" href="#">Terms</a>
</div>
</footer>
<script>
        // Simple script to handle dark mode toggle if implemented, or just detecting system preference
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body></html>
