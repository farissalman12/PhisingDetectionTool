<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PhishGuard Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5247e6",
                        "background-light": "#f6f6f8",
                        "background-dark": "#121121",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased min-h-screen flex flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-[#1a1a2e] px-10 py-3 sticky top-0 z-50">
<div class="flex items-center gap-4">
<div class="size-8 text-primary">
<svg class="w-full h-full" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 18.4228L42 11.475V34.3663C42 34.7796 41.7457 35.1504 41.3601 35.2992L24 42V18.4228Z" fill="currentColor" fill-rule="evenodd"></path>
<path clip-rule="evenodd" d="M24 8.18819L33.4123 11.574L24 15.2071L14.5877 11.574L24 8.18819ZM9 15.8487L21 20.4805V37.6263L9 32.9945V15.8487ZM27 37.6263V20.4805L39 15.8487V32.9945L27 37.6263ZM25.354 2.29885C24.4788 1.98402 23.5212 1.98402 22.646 2.29885L4.98454 8.65208C3.7939 9.08038 3 10.2097 3 11.475V34.3663C3 36.0196 4.01719 37.5026 5.55962 38.098L22.9197 44.7987C23.6149 45.0671 24.3851 45.0671 25.0803 44.7987L42.4404 38.098C43.9828 37.5026 45 36.0196 45 34.3663V11.475C45 10.2097 44.2061 9.08038 43.0155 8.65208L25.354 2.29885Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<div class="flex items-baseline gap-2">
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">PhishGuard</h2>
<span class="text-xs text-slate-500 font-medium dark:text-slate-400">by Faris Salman</span>
</div>
</div>
<div class="flex flex-1 justify-end gap-8">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-9 px-4 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-900 dark:text-white text-sm font-medium transition-colors">
<span class="truncate">Log in</span>
</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-4 sm:p-8">
<div class="w-full max-w-md">
<div class="bg-white dark:bg-[#1e1c2e] rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden">
<div class="p-8 pb-6 text-center">
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">Create an account</h1>
<p class="text-sm text-slate-500 dark:text-slate-400">
                        Enter your details to get started with free phishing detection.
                    </p>
</div>
<div class="px-8 pb-8 space-y-5">
<div class="space-y-2">
<label class="block text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-700 dark:text-slate-300" for="full-name">
                            Full Name
                        </label>
<input class="flex h-10 w-full rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#1a1a2e] px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:text-white" id="full-name" placeholder="John Doe" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-700 dark:text-slate-300" for="email">
                            Email Address
                        </label>
<input class="flex h-10 w-full rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#1a1a2e] px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:text-white" id="email" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-700 dark:text-slate-300" for="password">
                            Password
                        </label>
<div class="relative">
<input class="flex h-10 w-full rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#1a1a2e] px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:text-white pr-10" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
<div class="mt-2">
<div class="flex gap-1 h-1.5 w-full">
<div class="h-full w-1/4 rounded-full bg-red-500"></div>
<div class="h-full w-1/4 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-full w-1/4 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-full w-1/4 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">Password strength: <span class="text-red-500 font-medium">Weak</span></p>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-slate-700 dark:text-slate-300" for="confirm-password">
                            Confirm Password
                        </label>
<div class="relative">
<input class="flex h-10 w-full rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-[#1a1a2e] px-3 py-2 text-sm ring-offset-white file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-slate-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 dark:ring-offset-slate-950 dark:placeholder:text-slate-400 dark:text-white pr-10" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-white transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-white hover:bg-primary/90 h-10 px-4 py-2 mt-2">
                        Create Account
                    </button>
<div class="text-center text-sm text-slate-500 dark:text-slate-400 mt-4">
                        Already have an account? 
                        <a class="font-medium text-primary hover:underline hover:text-primary/80 transition-colors" href="#">Log in</a>
</div>
</div>
<div class="bg-slate-50 dark:bg-slate-800/50 px-8 py-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-slate-400 text-[16px]">lock</span>
<span class="text-xs text-slate-500 dark:text-slate-400 font-medium">Secured by PhishGuard Encryption</span>
</div>
</div>
<p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-6 px-8">
                By clicking "Create Account", you agree to our <a class="underline hover:text-slate-500 dark:hover:text-slate-400" href="#">Terms of Service</a> and <a class="underline hover:text-slate-500 dark:hover:text-slate-400" href="#">Privacy Policy</a>.
            </p>
</div>
</main>

</body></html>
