services:
  # 1. Backend Service (NestJS API)
  - type: web
    name: phishing-tool-backend
    env: node
    rootDir: backend
    buildCommand: |
      npm install
      npx prisma generate
      npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        sync: false # User will provide the Neon Connection String here
      - key: JWT_SECRET
        generateValue: true
      - key: SAFE_BROWSING_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # 2. Frontend Service (Served via Node container for stability)
  - type: web
    name: phishing-tool-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: phishing-tool-backend
          property: url
